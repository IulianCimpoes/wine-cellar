spring.application.name=wine-cellar
spring.datasource.url=jdbc:h2:mem:winecellar;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.placeholders.seed.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show SQL (good for learning; keep OFF in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL statements via logger (more consistent than show-sql)
logging.level.org.hibernate.SQL=DEBUG

# Optional: show bind parameters (very verbose)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.default_batch_fetch_size=10

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.cache.type=caffeine
spring.cache.cache-names=wineriesList
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n

